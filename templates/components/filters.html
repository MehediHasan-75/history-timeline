<form id="event-filters" class="space-y-6" method="get" data-filter-form>
  <div class="flex items-center justify-between">
    <h2 class="font-display text-xl font-bold">{% if LANGUAGE_CODE == 'bn' %}ঘটনা ফিল্টার করুন{% else %}Filter events{% endif %}</h2>
    <button class="btn-ghost px-2 lg:hidden" type="button" data-drawer-close aria-label="Close filters">
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-width="1.8" d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div>
    <label class="field-label" for="filter-search">{% if LANGUAGE_CODE == 'bn' %}খুঁজুন{% else %}Search{% endif %}</label>
    <input class="form-control" id="filter-search" type="search" name="q" value="{{ filters.q|default:'' }}" placeholder="{% if LANGUAGE_CODE == 'bn' %}শিরোনাম বা বিবরণ{% else %}Title or description{% endif %}">
  </div>
  <div>
    <label class="field-label" for="filter-category">{% if LANGUAGE_CODE == 'bn' %}বিভাগ{% else %}Category{% endif %}</label>
    <select class="form-select" id="filter-category" name="category">
      <option value="">All categories</option>
      {% for category in categories %}<option value="{{ category.slug }}" {% if filters.category == category.slug %}selected{% endif %}>{{ category.name }}</option>{% endfor %}
    </select>
  </div>
  {% if tags %}
    <fieldset>
      <legend class="field-label">Tags</legend>
      <div class="max-h-40 space-y-2 overflow-y-auto rounded-lg border border-stone-200 bg-white p-3">
        {% for tag in tags %}
          <label class="flex min-h-8 cursor-pointer items-center gap-2 text-sm text-stone-700">
            <input class="size-4 rounded border-stone-300 text-amber-700 focus:ring-amber-700" type="checkbox" name="tag" value="{{ tag.slug }}" {% if tag.slug in selected_tags %}checked{% endif %}>
            <span>#{{ tag.name }}</span>
          </label>
        {% endfor %}
      </div>
    </fieldset>
  {% endif %}
  <fieldset>
    <legend class="field-label">{% if LANGUAGE_CODE == 'bn' %}পঞ্জিকা{% else %}Calendar{% endif %}</legend>
    <select class="form-select" name="calendar" data-filter-calendar>
      <option value="GREGORIAN" {% if filters.calendar != 'BENGALI_BD' %}selected{% endif %}>Gregorian</option>
      <option value="BENGALI_BD" {% if filters.calendar == 'BENGALI_BD' %}selected{% endif %}>বাংলাদেশ বাংলা</option>
    </select>
  </fieldset>
  <fieldset data-filter-era>
    <legend class="field-label">Era</legend>
    <div class="grid grid-cols-3 gap-2">
      {% for value, label in era_choices %}
        <label class="cursor-pointer">
          <input class="peer sr-only" type="radio" name="era" value="{{ value }}" {% if filters.era == value or not filters.era and not value %}checked{% endif %}>
          <span class="flex min-h-10 items-center justify-center rounded-lg border border-stone-300 bg-white px-2 text-sm font-semibold peer-checked:border-amber-700 peer-checked:bg-amber-50 peer-checked:text-amber-900">{{ label }}</span>
        </label>
      {% endfor %}
    </div>
  </fieldset>
  <fieldset>
    <legend class="field-label">Start-year range</legend>
    <div class="space-y-3">
      <div class="grid grid-cols-[1fr_6rem] gap-2">
        <input class="form-control" type="text" inputmode="numeric" name="year_from_abs" value="{{ filters.year_from_abs|default:'' }}" aria-label="Earliest year" placeholder="From">
        <select class="form-select px-2" name="year_from_era" aria-label="Earliest year era"><option {% if filters.year_from_era == 'BCE' %}selected{% endif %}>BCE</option><option {% if filters.year_from_era != 'BCE' %}selected{% endif %}>CE</option></select>
      </div>
      <div class="grid grid-cols-[1fr_6rem] gap-2">
        <input class="form-control" type="text" inputmode="numeric" name="year_to_abs" value="{{ filters.year_to_abs|default:'' }}" aria-label="Latest year" placeholder="To">
        <select class="form-select px-2" name="year_to_era" aria-label="Latest year era"><option {% if filters.year_to_era == 'BCE' %}selected{% endif %}>BCE</option><option {% if filters.year_to_era != 'BCE' %}selected{% endif %}>CE</option></select>
      </div>
    </div>
  </fieldset>
  <div class="flex gap-2">
    <button class="btn-primary flex-1" type="submit">{% if LANGUAGE_CODE == 'bn' %}ফিল্টার প্রয়োগ করুন{% else %}Apply filters{% endif %}</button>
    <button class="btn-secondary" type="reset">{% if LANGUAGE_CODE == 'bn' %}রিসেট{% else %}Reset{% endif %}</button>
  </div>
</form>
