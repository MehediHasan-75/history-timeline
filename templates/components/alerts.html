{% if messages %}
  <div class="container-page relative z-30 mt-4 space-y-2" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
      <div class="flex items-start justify-between gap-4 rounded-xl border px-4 py-3 text-sm font-medium {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-900{% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-900{% else %}border-amber-200 bg-amber-50 text-amber-900{% endif %}" role="status">
        <p>{{ message }}</p>
      </div>
    {% endfor %}
  </div>
{% endif %}
