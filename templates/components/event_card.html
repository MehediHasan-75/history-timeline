<article class="paper-card flex h-full flex-col p-5">
  <div class="flex items-start justify-between gap-3">
    <p class="text-sm font-semibold text-amber-800">{{ event.display_date }}</p>
    <span class="rounded-full px-2.5 py-1 text-xs font-semibold {% if event.is_published %}bg-emerald-100 text-emerald-800{% else %}bg-stone-100 text-stone-600{% endif %}">{% if event.is_published %}Published{% else %}Private{% endif %}</span>
  </div>
  <h2 class="mt-3 text-xl"><a class="hover:text-amber-800" href="{% url 'events:detail' event.pk %}">{{ event.title }}</a></h2>
  <p class="mt-2 line-clamp-3 flex-1 text-sm leading-6 text-stone-600">{{ event.description }}</p>
  <div class="mt-5 flex flex-wrap items-center gap-2 border-t border-stone-100 pt-4">
    <span class="chip" style="--category-color: {{ event.category.color }}">{{ event.category.name }}</span>
    {% for tag in event.tags.all|slice:':3' %}<span class="text-sm text-stone-500">#{{ tag.name }}</span>{% endfor %}
  </div>
</article>
