{% extends "layouts/app.html" %}

{% block title %}Delete {{ event.title }} — History Timeline{% endblock %}

{% block content %}
  <div class="mx-auto max-w-xl py-8 sm:py-16">
    <section class="paper-card p-6 sm:p-8" aria-labelledby="delete-title">
      <div class="grid size-14 place-items-center rounded-full bg-red-100 text-red-700" aria-hidden="true"><svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-width="1.8" d="M12 9v4m0 4h.01M10.3 3.8 2.5 17.2A2 2 0 0 0 4.2 20h15.6a2 2 0 0 0 1.7-2.8L13.7 3.8a2 2 0 0 0-3.4 0Z"/></svg></div>
      <h1 id="delete-title" class="mt-5 text-3xl">Delete this event?</h1>
      <p class="mt-3 text-stone-600"><strong class="text-stone-900">{{ event.title }}</strong> will be permanently removed from your collection and public timeline.</p>
      <form class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end" method="post">
        {% csrf_token %}
        <a class="btn-secondary" href="{% url 'events:detail' event.pk %}">Keep event</a>
        <button class="btn-danger" type="submit">Delete permanently</button>
      </form>
    </section>
  </div>
{% endblock %}
