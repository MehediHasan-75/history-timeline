services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: history
      POSTGRES_USER: history
      POSTGRES_PASSWORD: history
    ports:
      - "5432:5432"
    volumes:
      - history_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U history -d history"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  history_postgres_data:
